name: eldoria-local
services:
  db:
    image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    environment:
      POSTGRES_DB: eldoria
      POSTGRES_USER: eldoria
      POSTGRES_PASSWORD: ${ELDORIA_DB_PASSWORD:?Run npm run db:up}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eldoria -d eldoria"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres:
